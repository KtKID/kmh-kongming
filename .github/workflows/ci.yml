# 构建与验证孔明套件；版本标签发布 DeepSeek Harness 可直接安装的预编译包。
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm -r --filter './packages/*' run build
      - name: 类型检查
        run: pnpm -r --filter './packages/*' run typecheck
      - name: 测试
        run: pnpm -r --filter './packages/*' test
      - name: Lint
        run: pnpm -r --filter './packages/*' run lint
      - name: 格式检查
        run: pnpm -r --filter './packages/*' run format:check
      - name: 打包发布件
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./packages/kongming/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          pnpm pack:dsh
          mv "dist/kmh-kongming-$version.tgz" dist/kmh-kongming.tgz
      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/kmh-kongming.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/kmh-kongming.tgz --verify-tag --generate-notes
          fi
