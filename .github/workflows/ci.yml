# 孔明套件仓 CI（对齐 kmh-scening 模式）：devDeps 为 npm 发布版 @deepseek-ai/dsh-*，
# 本仓可独立安装构建；与底座的真组合验证由宿主 kongming-os 侧守卫覆盖。
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm -r --filter './packages/*' run build
      - name: 类型检查
        run: pnpm -r --filter './packages/*' run typecheck
      - name: 测试
        run: pnpm -r --filter './packages/*' test
      - name: Lint
        run: pnpm -r --filter './packages/*' run lint
      - name: 格式检查
        run: pnpm -r --filter './packages/*' run format:check
      - name: 打包发布件
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          tar --exclude='.git' --exclude='node_modules' --exclude='packages/*/lib'
          -czf "/tmp/kmh-kongming-kongming-${GITHUB_REF_NAME}.tar.gz"
          -C "$GITHUB_WORKSPACE"/packages/kongming .
          && tar --exclude='.git' --exclude='node_modules' --exclude='packages/*/lib'
          -czf "/tmp/kmh-kongming-memory-${GITHUB_REF_NAME}.tar.gz"
          -C "$GITHUB_WORKSPACE"/packages/kongming-memory .
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "/tmp/kmh-kongming-kongming-${GITHUB_REF_NAME}.tar.gz"
          "/tmp/kmh-kongming-memory-${GITHUB_REF_NAME}.tar.gz" --clobber
